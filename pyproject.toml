[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netscan"
version = "2.0.0"
description = "Asynchronous TCP port scanner with service detection, banner grabbing and risk classification."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Youssef Alaoui Hichami", email = "alaouihichamiyoussef@gmail.com" }]
maintainers = [{ name = "Youssef Alaoui Hichami", email = "alaouihichamiyoussef@gmail.com" }]
keywords = ["network", "security", "port-scanner", "recon", "asyncio", "nmap"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "mypy>=1.8",
  "ruff>=0.3",
]

[project.scripts]
netscan = "netscan.cli:main"

[project.urls]
Homepage = "https://github.com/7xd10/Network-Scanner"
Repository = "https://github.com/7xd10/Network-Scanner"
Issues = "https://github.com/7xd10/Network-Scanner/issues"
Changelog = "https://github.com/7xd10/Network-Scanner/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netscan = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S", "ASYNC", "PT"]
ignore = [
  "S101",    # assert is fine in tests
  "S104",    # binding/scanning 0.0.0.0 is a legitimate input
  "S311",    # no crypto in this tool
  "SIM108",  # ternary isn't always clearer
  "PT011",   # pytest.raises without match is acceptable here
  # The package targets Python 3.9, so typing.List/Tuple/Optional and
  # typing.Dict are deliberate: PEP 585/604 syntax in a runtime-evaluated
  # position would break 3.9 even with `from __future__ import annotations`.
  "UP006",
  "UP007",
  "UP035",
  "UP045",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PT", "E501"]
"Network-scanner.py" = ["E", "W", "I", "N", "UP", "S"]

[tool.mypy]
python_version = "3.10"
files = ["src/netscan"]
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["netscan"]

[tool.coverage.report]
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
